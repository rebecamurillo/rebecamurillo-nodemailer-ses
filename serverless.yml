# serverless.yml
service: rebecamurillo-nodemailer-ses

provider:
  name: aws
  runtime: nodejs20.x
  region: ${param:AWS_REGION}
  stage: production
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "ses:SendEmail"
            - "ses:SendRawEmail"
          Resource: "*"
  environment:
    AWS_REGION_SES: ${param:AWS_REGION}
    DEFAULT_TO_EMAIL: ${param:DEFAULT_TO_EMAIL}
    DEFAULT_FROM_EMAIL: ${param:DEFAULT_FROM_EMAIL}
    CAPTCHA_SECRET_KEY: ${param:CAPTCHA_SECRET_KEY}
    ALLOWED_ORIGIN: ${param:ALLOWED_ORIGIN}

functions:
  sendEmail:
    handler: index.handler
    name: sendEmail
    description: Send email using nodemailer and AWS SES   
    events:
      - http:
          path: message
          method: post
      # Preflight is answered by the function so it can match ALLOWED_ORIGIN's list
      - http:
          path: message
          method: options